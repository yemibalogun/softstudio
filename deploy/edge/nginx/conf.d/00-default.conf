# Anything that does not name one of our sites (bare IP, someone else's
# domain pointed here, scanners) is dropped rather than served a site.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # A certificate has to exist for the socket to start; this one is never
    # shown to a visitor who asked for a real site by name.
    ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;

    return 444;
}
