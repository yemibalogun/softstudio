# jaybalostudio.com -> the softstudio app (compose project "softstudio",
# reached on its own network as softstudio-web:8000).

upstream jaybalostudio_app {
    server softstudio-web:8000;
}

server {
    listen 80;
    server_name jaybalostudio.com www.jaybalostudio.com;

    # Certificate renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jaybalostudio.com$request_uri;
    }
}

# www -> apex, so the site has one canonical address.
server {
    listen 443 ssl;
    http2 on;
    server_name www.jaybalostudio.com;

    ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;

    return 301 https://jaybalostudio.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jaybalostudio.com;

    ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;

    # Matches the app's MAX_CONTENT_LENGTH (8 MB) with a little headroom.
    client_max_body_size 10M;

    # Admin-uploaded images (app/uploads.py). Only names the app itself
    # generates are served: <folder>/<32 hex>.<jpg|png|webp>. The files are
    # re-encoded on upload; these headers stop a browser ever treating one
    # as anything but an image.
    location ~ "^/static/images/uploads/(?<upload>[a-z]+/[0-9a-f]{32}\.(?:jpg|png|webp))$" {
        alias /srv/jaybalostudio/static/images/uploads/$upload;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    location /static/images/uploads/ {
        return 404;
    }

    location /static/ {
        alias /srv/jaybalostudio/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://jaybalostudio_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
