# shamsfoodstore.com -> the food store app (compose project "food_store",
# reached on its own network as food_store-web-1:8000).
#
# Settings carried over from that project's own nginx.conf, which this
# replaced as the front door: 5 MB uploads, its static served straight from
# the shared static volume, and the same bounded proxy timeouts.

server {
    listen 80;
    server_name shamsfoodstore.com www.shamsfoodstore.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name shamsfoodstore.com www.shamsfoodstore.com;

    ssl_certificate     /etc/letsencrypt/live/shamsfoodstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shamsfoodstore.com/privkey.pem;

    # Matches the food store's MAX_CONTENT_LENGTH (5 MB) for product images.
    client_max_body_size 5M;

    location /static/ {
        alias /srv/shamsfoodstore/static/;
        expires 30d;
        access_log off;
    }

    location / {
        # Variable on purpose: resolved per request, not at startup.
        set $shamsfoodstore_app "http://food_store-web-1:8000";
        proxy_pass $shamsfoodstore_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
