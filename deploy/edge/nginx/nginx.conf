worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Largest upload any site here accepts; each vhost narrows it further.
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Real client address for the site behind us: each vhost passes it on in
    # X-Forwarded-For, and the apps read it (Flask ProxyFix) for rate limits
    # and logs.
    log_format edge '$remote_addr - $host "$request" $status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log edge;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # One file per site.
    include /etc/nginx/conf.d/*.conf;
}
