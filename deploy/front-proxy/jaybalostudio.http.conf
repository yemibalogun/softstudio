# Phase 1 (no certificate yet): answer Let's Encrypt challenges for
# jaybalostudio.com and redirect everything else to HTTPS.
server {
    listen 80;
    server_name jaybalostudio.com www.jaybalostudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jaybalostudio.com$request_uri;
    }
}
