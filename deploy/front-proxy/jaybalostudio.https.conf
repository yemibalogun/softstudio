# jaybalostudio.com -> softstudio stack (container alias "jaybalostudio" on
# this network). Certificates live in the food store's certbot directory.
server {
    listen 80;
    server_name jaybalostudio.com www.jaybalostudio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jaybalostudio.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.jaybalostudio.com;

    ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;

    return 301 https://jaybalostudio.com$request_uri;
}

server {
    listen 443 ssl;
    server_name jaybalostudio.com;

    ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;

    client_max_body_size 10M;

    # Resolve the upstream per request through Docker's DNS. With a fixed
    # upstream, nginx refuses to start while softstudio is down, which would
    # also take shamsfoodstore.com offline.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $jaybalostudio_upstream http://jaybalostudio:80;

    location / {
        proxy_pass $jaybalostudio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
