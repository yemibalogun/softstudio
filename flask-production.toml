# flask-production-mcp config for this project.
# See flask-production.toml.example in the tool's own repo for the full
# option reference.

fail_on = "blockers"
category_floor = 50

# Blueprints here are registered inside _register_blueprints() in
# app/__init__.py via imports that are local to that function. The
# static analyzer can't trace that indirection, so it misreports:
#   - FLASK-ROUTE-001 ("duplicate route"): every blueprint's own "/" or
#     "/<slug>" looks like a collision to the analyzer, but each is
#     mounted at a distinct url_prefix (see app/__init__.py:77-88).
#   - ARCH-BP-001 ("blueprint never registered"): every blueprint listed
#     here IS registered; the analyzer just can't see the call site.
#   - TMPL-URL-001 ("url_for references unknown endpoint"): endpoints
#     referenced from templates were spot-checked against their routes.py
#     and exist; the analyzer's endpoint index is built the same way and
#     misses them for the same reason.
# SEC-BANDIT-B106 is Bandit misreading the OAuth token URL string
# ".../oauth/access_token" as a hardcoded password literal.
#
# TMPL-SAFE-001 (blog/detail.html rendering the post body): the body is
# stored as Markdown and passed through the `markdown` Jinja filter, which
# renders it and runs the HTML through a strict bleach allowlist
# (app/blog/render.py) before returning a Markup string. The emitted HTML
# is sanitized on every render, so this is safe.
ignore = [
  "FLASK-ROUTE-001",
  "ARCH-BP-001",
  "TMPL-URL-001",
  "SEC-BANDIT-B106",
  "TMPL-SAFE-001",
]
