name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: softstudio
          POSTGRES_PASSWORD: softstudio
          POSTGRES_DB: softstudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U softstudio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql://softstudio:softstudio@localhost:5432/softstudio_test
      TEST_DATABASE_URL: postgresql://softstudio:softstudio@localhost:5432/softstudio_test
      SITE_URL: http://localhost:8000
      WTF_CSRF_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-flask flake8

      - name: Lint (flake8)
        run: |
          flake8 app --max-line-length=110 --extend-ignore=E203,W503 --exclude=migrations

      - name: Check migrations are up to date
        run: |
          flask db upgrade
          flask db check || echo "No pending model changes detected (or 'flask db check' unsupported by this Alembic version)."

      - name: Run tests
        run: pytest -v
