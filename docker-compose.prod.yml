# Production on the shared VPS. shamsfoodstore.com's nginx (food_store-nginx-1)
# owns ports 80/443 and forwards jaybalostudio.com to our nginx over the
# food store's Docker network, so nothing here is published to the host.

services:
  db:
    restart: always

  web:
    restart: always
    environment:
      FLASK_ENV: production
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 60 --access-logfile - --error-logfile - wsgi:app
    networks:
      default:
        aliases:
          - softstudio-web

  nginx:
    restart: always
    ports: !reset []
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/static:ro
    networks:
      default: {}
      front:
        aliases:
          - jaybalostudio

networks:
  front:
    external: true
    name: ${FRONT_NETWORK:-food_store_default}
