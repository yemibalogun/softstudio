# Production: jaybalostudio.com with its own nginx and Let's Encrypt HTTPS.
#
# HTTP_BIND / HTTPS_BIND (set in .env) choose where nginx listens on the host.
# Default "80" / "443" means every IP address. On a server where another site
# already uses 80/443, bind to an IP of our own, e.g.
#   HTTP_BIND=203.0.113.20:80
#   HTTPS_BIND=203.0.113.20:443

services:
  db:
    restart: always

  web:
    restart: always
    environment:
      FLASK_ENV: production
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 60 --access-logfile - --error-logfile - wsgi:app
    networks:
      default:
        aliases:
          - softstudio-web

  nginx:
    restart: always
    ports: !override
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/static:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Reload every 6h so renewed certificates are picked up.
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot}
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renews only when a certificate is within 30 days of expiry.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
