{% extends "admin/_admin_base.html" %}

{% block title %}Edit reel — Admin{% endblock %}

{% block admin_content %}
<div class="mb-8 flex items-center justify-between gap-4">
  <h1 class="text-3xl font-bold">Edit: {{ post.heading }}</h1>
  <a href="{{ url_for('admin.instagram_list') }}" class="btn btn-ghost btn-sm">← Reels page</a>
</div>

<form method="POST" enctype="multipart/form-data" class="card border border-base-300 bg-base-100 shadow-sm">
  <div class="card-body gap-6">
    {% if post.cover_image %}
      <img src="{{ post.cover_image }}" alt="Current cover" class="h-48 w-27 rounded-box object-cover" style="width:6.75rem">
    {% endif %}
    {% include "admin/_instagram_fields.html" %}
    <div class="card-actions justify-end">
      <a href="{{ url_for('admin.instagram_list') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </div>
</form>
{% endblock %}
