<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block subject %}{{ site_name }}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#080B12; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#080B12; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; background-color:#111722; border:1px solid #273244; border-radius:16px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="padding: 28px 32px; border-bottom:1px solid #273244;">
              <span style="display:inline-block; width:28px; height:28px; border-radius:50%; background-color:#18202C; border:1px solid #273244; text-align:center; line-height:28px; color:#F5B800; font-weight:700; font-size:14px;">S</span>
              <span style="color:#F5F7FA; font-weight:600; font-size:16px; margin-left:8px;">{{ site_name }}</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 32px; color:#F5F7FA;">
              {% block body %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 32px; border-top:1px solid #273244; color:#9CA3AF; font-size:12px; line-height:1.6;">
              <p style="margin:0 0 8px;">{{ site_name }} · <a href="{{ site_url }}" style="color:#3B82F6; text-decoration:none;">{{ site_url }}</a></p>
              <p style="margin:0;">
                <a href="{{ site_url }}/privacy" style="color:#9CA3AF; text-decoration:underline;">Privacy Policy</a> ·
                <a href="{{ site_url }}/cookies" style="color:#9CA3AF; text-decoration:underline;">Cookie Policy</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
