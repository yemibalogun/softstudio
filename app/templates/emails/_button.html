{% macro email_button(url, label, color="#F5B800", text_color="#14110A") %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin: 8px 0 24px;">
  <tr>
    <td style="border-radius:10px; background-color:{{ color }};">
      <a href="{{ url }}" target="_blank"
         style="display:inline-block; padding:12px 24px; font-size:15px; font-weight:600;
                color:{{ text_color }}; text-decoration:none; border-radius:10px;">
        {{ label }}
      </a>
    </td>
  </tr>
</table>
{% endmacro %}
