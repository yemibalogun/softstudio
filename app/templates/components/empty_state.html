<div class="surface flex min-h-56 flex-col items-center justify-center px-6 py-14 text-center">
  <span class="accent-rule accent-rule--center" aria-hidden="true"></span>

  <h3 class="mt-7 text-xl font-medium tracking-[-0.02em] text-base-content">
    {{ title|default("Nothing here yet") }}
  </h3>

  <p class="mt-3 max-w-md text-[0.95rem] leading-7 text-base-content/55">
    {{ description|default("Check back soon.") }}
  </p>

  {% if cta_url %}
    <a
      href="{{ cta_url }}"
      class="btn btn-outline btn-sm mt-7 px-5"
    >
      {{ cta_label|default("Go back") }}
    </a>
  {% endif %}
</div>
