<div
  class="flex min-h-52 flex-col items-center justify-center rounded-2xl border border-dashed border-base-300 bg-base-200/30 px-6 py-10 text-center"
>
  <h3 class="text-lg font-semibold text-base-content">
    {{ title|default("Nothing here yet") }}
  </h3>

  <p class="mt-2 max-w-md text-sm leading-6 text-base-content/60">
    {{ description|default("Check back soon.") }}
  </p>

  {% if cta_url %}
    <a
      href="{{ cta_url }}"
      class="btn btn-secondary btn-sm mt-5"
    >
      {{ cta_label|default("Go back") }}
    </a>
  {% endif %}
</div>
