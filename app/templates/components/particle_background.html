{#
  Ambient background: navy ground, one slow electric-blue field, a two-layer
  star field drifting upward, grain and vignette. Pure CSS (particles.css),
  transform / opacity only, frozen under prefers-reduced-motion.

  The #particle-background id is kept so existing references keep resolving.
#}
<div
  id="particle-background"
  aria-hidden="true"
  class="pointer-events-none fixed inset-0 -z-10 overflow-hidden"
>
  <div class="ambient-field"></div>
  <div class="ambient-starmask">
    <div class="ambient-stars ambient-stars--far"></div>
    <div class="ambient-stars ambient-stars--near"></div>
  </div>
  <div class="ambient-grain"></div>
  <div class="ambient-vignette"></div>
</div>
