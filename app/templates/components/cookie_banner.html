<!--
  Cookie consent banner.

  The data attributes in this component are part of the JavaScript API
  used by initCookieConsent() in main.js. They must remain unchanged.
-->
<div
  class="fixed inset-x-4 bottom-4 z-[60] hidden max-w-2xl rounded-2xl border border-base-300 bg-base-200/95 p-5 shadow-2xl backdrop-blur-xl sm:left-auto sm:right-6 sm:max-w-xl"
  data-cookie-banner
  role="dialog"
  aria-label="Cookie consent"
>
  <div class="space-y-3">

    <div>
      <h2 class="text-base font-semibold text-base-content">
        We value your privacy.
      </h2>

      <p class="mt-2 text-sm leading-6 text-base-content/65">
        We use necessary cookies to operate this website. With your permission,
        we may also use analytics cookies to understand how visitors use the site.
        See our
        <a
          href="{{ url_for('legal.cookies') }}"
          class="font-medium text-primary underline-offset-4 hover:underline"
        >
          Cookie Policy
        </a>.
      </p>
    </div>

    <div class="flex flex-col gap-2 pt-2 sm:flex-row sm:flex-wrap sm:justify-end">

      <button
        type="button"
        class="btn btn-primary btn-sm"
        data-cookie-accept-all
      >
        Accept All
      </button>

      <button
        type="button"
        class="btn btn-secondary btn-sm"
        data-cookie-reject
      >
        Reject Optional
      </button>

      <button
        type="button"
        class="btn btn-ghost btn-sm"
        data-cookie-manage
      >
        Manage Preferences
      </button>

    </div>
  </div>
</div>


<!--
  Cookie preferences modal.

  `data-cookie-preferences-modal` and `modal-overlay` are intentionally
  preserved because main.js uses both selectors when opening/closing
  the preferences dialog.
-->
<!--
  Cookie preferences modal.

  main.js opens this modal by adding `.is-open` and closes it by
  removing `.is-open`. We keep both the existing class and data
  attribute so the JavaScript contract remains unchanged.
-->
<div
  class="modal-overlay fixed inset-0 z-[70] hidden items-center justify-center bg-black/70 p-4 backdrop-blur-sm"
  data-cookie-preferences-modal
  role="dialog"
  aria-modal="true"
  aria-labelledby="cookie-prefs-title"
>
  <div
    class="w-full max-w-lg rounded-2xl border border-base-300 bg-base-100 p-6 shadow-2xl sm:p-8"
  >

    <div class="mb-6">
      <h2
        id="cookie-prefs-title"
        class="text-xl font-semibold text-base-content"
      >
        Cookie Preferences
      </h2>

      <p class="mt-2 text-sm leading-6 text-base-content/60">
        Choose which optional cookies you would like to allow.
      </p>
    </div>

    <form data-cookie-preferences-form>

      <!-- Necessary cookies -->
      <div class="mb-4 rounded-xl border border-base-300 bg-base-200/50 p-4">
        <label class="flex items-start gap-3">

          <input
            type="checkbox"
            class="checkbox checkbox-sm mt-0.5"
            checked
            disabled
          >

          <span>
            <span class="block text-sm font-medium text-base-content">
              Necessary
            </span>

            <span class="mt-1 block text-xs leading-5 text-base-content/60">
              Always enabled for authentication, security, and CSRF protection.
            </span>
          </span>

        </label>
      </div>

      <!-- Analytics cookies -->
      <div class="mb-4 rounded-xl border border-base-300 bg-base-200/50 p-4">
        <label class="flex cursor-pointer items-start gap-3">

          <input
            type="checkbox"
            name="analytics"
            class="checkbox checkbox-primary checkbox-sm mt-0.5"
          >

          <span>
            <span class="block text-sm font-medium text-base-content">
              Analytics
            </span>

            <span class="mt-1 block text-xs leading-5 text-base-content/60">
              Helps us understand how visitors use the site.
            </span>
          </span>

        </label>
      </div>

      <!-- Marketing cookies -->
      <div class="mb-6 rounded-xl border border-base-300 bg-base-200/50 p-4">
        <label class="flex cursor-pointer items-start gap-3">

          <input
            type="checkbox"
            name="marketing"
            class="checkbox checkbox-primary checkbox-sm mt-0.5"
          >

          <span>
            <span class="block text-sm font-medium text-base-content">
              Marketing
            </span>

            <span class="mt-1 block text-xs leading-5 text-base-content/60">
              Used for personalized content and marketing experiences.
            </span>
          </span>

        </label>
      </div>

      <!-- Modal actions -->
      <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">

        <button
          type="button"
          class="btn btn-ghost btn-sm"
          data-modal-close
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary btn-sm"
        >
          Save Preferences
        </button>

      </div>

    </form>
  </div>
</div>
