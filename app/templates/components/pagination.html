{% if pagination and pagination.pages > 1 %}

<nav aria-label="Pagination">

  <ul class="pagination">

    <!-- Previous page -->
    <li>
      <a
        href="{{ url_for(request.endpoint, page=pagination.prev_num) if pagination.has_prev else '#' }}"
        {% if pagination.has_prev %}
          aria-disabled="false"
        {% else %}
          aria-disabled="true"
        {% endif %}
      >
        ‹ Prev
      </a>
    </li>


    <!-- Page numbers -->
    {% for page_num in pagination.iter_pages() %}

      {% if page_num %}

        <li>
          {% if page_num == pagination.page %}

            <span
              class="is-active"
              aria-current="page"
            >
              {{ page_num }}
            </span>

          {% else %}

            <a
              href="{{ url_for(request.endpoint, page=page_num) }}"
            >
              {{ page_num }}
            </a>

          {% endif %}
        </li>

      {% else %}

        <!-- Ellipsis between non-adjacent page numbers -->
        <li>
          <span aria-hidden="true">…</span>
        </li>

      {% endif %}

    {% endfor %}


    <!-- Next page -->
    <li>
      <a
        href="{{ url_for(request.endpoint, page=pagination.next_num) if pagination.has_next else '#' }}"
        {% if pagination.has_next %}
          aria-disabled="false"
        {% else %}
          aria-disabled="true"
        {% endif %}
      >
        Next ›
      </a>
    </li>

  </ul>

</nav>

{% endif %}
