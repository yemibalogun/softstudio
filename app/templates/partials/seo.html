<title>{% block title %}{{ site_name }} · Custom Software, Applications and Developer Training{% endblock %}</title>
<meta name="description" content="{% block meta_description %}Custom software development, business automation, and practical developer training.{% endblock %}">
<link rel="canonical" href="{% block canonical %}{{ site_url }}{{ current_path }}{% endblock %}">
<meta name="robots" content="{% block robots %}index, follow{% endblock %}">

<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ self.meta_description() }}{% endblock %}">
<meta property="og:url" content="{{ self.canonical() }}">
<meta property="og:image" content="{% block og_image %}{{ site_url }}/static/images/brand/og-default.png{% endblock %}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ self.og_title() }}">
<meta name="twitter:description" content="{{ self.og_description() }}">
<meta name="twitter:image" content="{{ self.og_image() }}">
