{% extends "base.html" %}

{% block content %}

<section class="horizon flex min-h-[calc(100svh-4.5rem)] items-center">
  <div class="shell pb-[clamp(12rem,24vw,18rem)] pt-[clamp(3rem,7vw,5rem)] text-center" data-reveal-group="130">

    <p class="text-[clamp(5rem,14vw,9rem)] font-medium leading-none tracking-[-0.06em] text-transparent [-webkit-text-stroke:1px_rgba(124,203,255,0.45)]" aria-hidden="true" data-reveal>
      {% block error_code %}{% endblock %}
    </p>

    <h1 class="mx-auto mt-8 max-w-2xl text-[clamp(2rem,4vw,3.2rem)] text-base-content" data-reveal>
      {% block error_title %}{% endblock %}
    </h1>

    <p class="lede mx-auto mt-5 max-w-xl" data-reveal>
      {% block error_message %}{% endblock %}
    </p>

    <div class="mt-10" data-reveal>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary h-12 px-8">
        Back to home <span aria-hidden="true">&rarr;</span>
      </a>
    </div>

  </div>
</section>

{% endblock %}
