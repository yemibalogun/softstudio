{% extends "base.html" %}

{% block content %}

{#
  Shared authentication layout: a single glass panel floating above a
  planet horizon. Login, registration, password reset and email
  verification all extend this, so spacing lives here once.
#}
<section class="horizon flex min-h-[calc(100svh-4.5rem)] items-center">
  <div class="shell pb-[clamp(10rem,20vw,15rem)] pt-[clamp(3rem,7vw,5rem)]">
    <div class="auth-panel surface mx-auto w-full max-w-[26rem] p-8 shadow-[0_40px_80px_-40px_rgba(0,40,140,0.6)] backdrop-blur-xl sm:p-10" data-reveal>
      {% block auth_content %}{% endblock %}
    </div>
  </div>
</section>

{% endblock %}
