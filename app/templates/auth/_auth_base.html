{% extends "base.html" %}

{% block content %}

<section class="flex min-h-[70vh] items-center py-16 sm:py-20">

  <div class="mx-auto w-full max-w-md px-4 sm:px-6">

    <!--
      Shared authentication card.

      Every authentication page extends this template, so keeping the
      spacing, border, background, and shadow here ensures login,
      registration, password reset, and email verification pages remain
      visually consistent without duplicating layout code.
    -->
    <div class="card border border-base-300 bg-base-100 shadow-xl">

      <div class="card-body p-6 sm:p-8">

        {% block auth_content %}{% endblock %}

      </div>

    </div>

  </div>

</section>

{% endblock %}
