worker_processes auto;

events {
    worker_connections 1024;
}

# Internal proxy. The VPS is shared with shamsfoodstore.com, whose nginx owns
# ports 80/443, terminates TLS, and forwards jaybalostudio.com here over the
# shared Docker network (see deploy/front-proxy/). Nothing is published to the
# host, so the forwarding headers set by the front proxy are passed through
# unchanged: the app sees the real client IP and https.
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A unique alias: this container also sits on the food store's network,
    # where plain "web" would also resolve to the food store app.
    upstream softstudio_app {
        server softstudio-web:8000;
    }

    server {
        listen 80;
        server_name _;

        location /static/ {
            alias /app/static/;
            expires 30d;
            access_log off;
        }

        location / {
            proxy_pass http://softstudio_app;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_redirect off;
        }
    }
}
