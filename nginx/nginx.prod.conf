worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream flask_app {
        server web:8000;
    }

    # HTTP: serve Let's Encrypt challenges, redirect everything else to HTTPS.
    server {
        listen 80;
        server_name jaybalostudio.com www.jaybalostudio.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://jaybalostudio.com$request_uri;
        }
    }

    # HTTPS on www: canonicalise to the apex domain.
    server {
        listen 443 ssl;
        http2 on;
        server_name www.jaybalostudio.com;

        ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        return 301 https://jaybalostudio.com$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name jaybalostudio.com;

        ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        location /static/ {
            alias /app/static/;
            expires 30d;
            access_log off;
        }

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
