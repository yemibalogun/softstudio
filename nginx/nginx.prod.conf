worker_processes auto;

events {
    worker_connections 1024;
}

# jaybalostudio.com's own nginx: terminates HTTPS with its own Let's Encrypt
# certificate and proxies to the softstudio app. Independent of any other
# site on the server.
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream softstudio_app {
        server softstudio-web:8000;
    }

    # HTTP: Let's Encrypt challenges, everything else to HTTPS.
    server {
        listen 80;
        server_name jaybalostudio.com www.jaybalostudio.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://jaybalostudio.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.jaybalostudio.com;

        ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        return 301 https://jaybalostudio.com$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name jaybalostudio.com;

        ssl_certificate     /etc/letsencrypt/live/jaybalostudio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jaybalostudio.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Admin-uploaded images (app/uploads.py). Only names the app itself
        # generates are served: <folder>/<32 hex>.<jpg|png|webp>. The files are
        # re-encoded on upload; these headers stop the browser from ever
        # treating one as anything but an image.
        location ~ "^/static/images/uploads/(?<upload>[a-z]+/[0-9a-f]{32}\.(?:jpg|png|webp))$" {
            alias /app/static/images/uploads/$upload;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;
        }

        location /static/images/uploads/ {
            return 404;
        }

        location /static/ {
            alias /app/static/;
            expires 30d;
            access_log off;
        }

        location / {
            proxy_pass http://softstudio_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
