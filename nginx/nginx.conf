worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream flask_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Admin-uploaded images (app/uploads.py). Only names the app itself
        # generates are served: <folder>/<32 hex>.<jpg|png|webp>. The files are
        # re-encoded on upload; these headers stop the browser from ever
        # treating one as anything but an image.
        location ~ "^/static/images/uploads/(?<upload>[a-z]+/[0-9a-f]{32}\.(?:jpg|png|webp))$" {
            alias /app/static/images/uploads/$upload;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;
        }

        location /static/images/uploads/ {
            return 404;
        }

        location /static/ {
            alias /app/static/;
            expires 30d;
            access_log off;
        }

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
